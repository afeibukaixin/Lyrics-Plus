[package]
name = "lyrics-plus"
version = "2.2.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lyrics_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.2", default-features = false, features = ["deserialize"] }
base64 = "0.22"
encoding_rs = "0.8"
minisign-verify = "0.2.5"
lyrics-crypto = "0.1.3"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
strsim = "0.11"
tokio = { version = "1", features = ["macros", "sync", "time"] }
wait-timeout = "0.2"
zip = { version = "4.6.1", default-features = false }
rustfft = "6"
zhhz = "0.8.2"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2"
tauri-plugin-macos-fps = "0.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAttributedString", "NSBitmapImageRep", "NSButton", "NSColor", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSFontManager", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSResponder", "NSRunningApplication", "NSScreen", "NSStatusBarButton", "NSStatusItem", "NSUserInterfaceItemIdentification", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "libc", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGColor", "CGDirectDisplay"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["objc2"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["CVBase", "CVDisplayLink", "CVReturn", "objc2", "objc2-core-graphics"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["AE", "AEDataModel"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["block2", "NSArray", "NSAppleEventDescriptor", "NSAttributedString", "NSBundle", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSLocale", "NSObjCRuntime", "NSNotification", "NSObject", "NSOperation", "NSRange", "NSRunLoop", "NSString", "NSURL", "NSValue"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CADisplayLink", "CALayer", "CATextLayer", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
unicode-segmentation = "1"
objc2-scripting-bridge = { version = "0.3", default-features = false, features = ["std", "SBApplication", "SBObject", "libc", "objc2-core-services"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "block2", "objc2", "objc2-foundation", "SMAppService"] }
media-remote = "=0.3.8"

[dev-dependencies]
tempfile = "3"
