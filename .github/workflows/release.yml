name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            target: aarch64-apple-darwin
          - name: Intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Lyrics Plus ${{ github.ref_name }}
          releaseBody: |
            此版本由 GitHub Actions 自动构建，提供 Apple Silicon 与 Intel 两种架构的安装包。

            ### 下载说明

            - **Apple Silicon**：适用于 M1、M2、M3、M4 及后续 Apple 芯片机型（`aarch64-apple-darwin`）
            - **Intel**：适用于 Intel 处理器机型（`x86_64-apple-darwin`）

            请在 Assets 中选择与你的 Mac 芯片对应的安装包。

            > [!IMPORTANT]
            > 当前版本采用 macOS ad-hoc 签名，暂未进行 Apple Developer ID 签名与公证。首次打开如被 macOS 阻止，请前往“系统设置 → 隐私与安全性”，确认应用来源后选择“仍要打开”。

            当前暂未提供自动更新，请关注 Releases 获取后续版本。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: --target ${{ matrix.target }}
